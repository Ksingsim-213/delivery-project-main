<div class="flex min-h-dvh flex-col bg-[#EEF0EC] text-[#1C2420]">
  <header
    *ngIf="!isRiderWork()"
    class="z-[1000] shrink-0 border-b border-[#D2D7D1] bg-[#F8F9F7]"
  >
    <div class="mx-auto flex h-16 w-full max-w-[1900px] items-center justify-between gap-4 px-4 sm:px-6">
      <a
        routerLink="/dashboard"
        class="flex min-h-11 items-center gap-3 rounded-lg text-[#1C2420] outline-offset-4 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#315B49]"
      >
        <span class="grid h-9 w-9 place-items-center rounded-lg bg-[#315B49] text-xs font-bold tracking-wide text-white">DM</span>
        <span>
          <span class="block text-base font-semibold tracking-tight">Delivery Manager</span>
          <span class="hidden text-xs text-[#59635C] sm:block">ระบบจัดการงานจัดส่ง</span>
        </span>
      </a>
      <span class="hidden text-sm font-medium text-[#59635C] sm:block">กระดานปฏิบัติการจัดส่ง</span>
    </div>
  </header>

  <div
    class="mx-auto flex w-full max-w-[1900px] flex-1 flex-col gap-2 p-2 sm:gap-4 sm:p-4 md:grid md:min-h-0 md:grid-cols-[200px_minmax(0,1fr)]"
    [class.rider-shell]="isRiderWork()"
  >
    <nav
      *ngIf="!isRiderWork()"
      aria-label="เมนูหลัก"
      class="flex shrink-0 gap-1 overflow-x-auto rounded-xl border border-[#D2D7D1] bg-[#F8F9F7] p-1.5 md:sticky md:top-4 md:h-fit md:flex-col md:gap-1"
    >
      <a
        routerLink="/dashboard"
        routerLinkActive="owner-nav-active"
        ariaCurrentWhenActive="page"
        class="owner-nav-link"
      >ภาพรวม</a>
      <a
        routerLink="/customers"
        routerLinkActive="owner-nav-active"
        ariaCurrentWhenActive="page"
        class="owner-nav-link"
      >ลูกค้า</a>
      <a
        routerLink="/orders"
        routerLinkActive="owner-nav-active"
        ariaCurrentWhenActive="page"
        class="owner-nav-link"
      >ออเดอร์</a>
      <a
        routerLink="/riders"
        routerLinkActive="owner-nav-active"
        ariaCurrentWhenActive="page"
        class="owner-nav-link"
      >ไรเดอร์</a>
    </nav>

    <main class="min-w-0 md:min-h-0">
      <router-outlet />
    </main>
  </div>
</div>
